<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>

<div class="buttons">
    <button class="rock-btn"
        onclick="play('Rock')">
        Rock
    </button>

    <button class="paper-btn"
        onclick="play('Paper')">
        Paper
    </button>

    <button class="scissors-btn"
        onclick="play('Scissors')">
        Scissors
    </button>
</div>  

<div class="battle-area">
    <div>
        <h3>Player</h3>
        <img id="player-img" class="choice-img">
    </div>

    <div>
        <h3>Computer</h3>
        <img id="computer-img" class="choice-img">
    </div>
</div>

<button class="reset-btn" onclick="resetGame()">Reset</button>

    <h2 id="result"></h2>
    <h3 id="score">Player: 0 | Computer: 0</h3>
    <script src="script.js"></script>
</body>
</html>
