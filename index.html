<!DOCTYPE html>
<html>
<head>
    <title>Murim Clash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Murim Clash</h1>

<div class="buttons">
    <button class="rock-btn"
        onclick="play('Rock')">
        Divine Fist
    </button>

    <button class="paper-btn"
        onclick="play('Paper')">
        Golden Bell
    </button>

    <button class="scissors-btn"
        onclick="play('Scissors')">
        Sword Intent
    </button>
</div>  

<div class="battle-area">
    <div>
        <h3>Cultivator</h3>
        <img id="player-img" class="choice-img" src="">
    </div>

    <div>
        <h3>Enemy</h3>
        <img id="computer-img" class="choice-img" src="">
    </div>
</div>


<button class="reset-btn" onclick="resetGame()">Reset</button>

    <h2 id="result"></h2>
    <h3 id="score">Player: 0 | Computer: 0</h3>
    <script src="script.js"></script>
</body>
</html>
